name: Hello World Test self-hosted
 
on:
  workflow_dispatch: # Allows manual trigger
  push:               # Optional: Runs on code push
 
jobs:
  hello-world-job:
    runs-on: self-hosted  # Use your local laptop as runner (must be configured as self-hosted)
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Print Hello World
        run: echo "Hello World from my local laptop!"
 
